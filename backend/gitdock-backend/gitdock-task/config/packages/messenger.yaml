framework:
    messenger:
        failure_transport: failed
        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: gitdock.exchange
                        type: topic
                    queues:
                        collaborator-added-queue:
                            binding_keys: ['collaborator.added.event']
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
        routing:
            'App\Message\UserRegisteredMessage': async
