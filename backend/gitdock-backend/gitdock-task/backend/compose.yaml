services:
  nginx_webserver:
    build:
      context: ./infra/
      args:
        BUILD_ARGUMENT_ENV: dev
      dockerfile: ./nginx/Dockerfile
    restart: always
    ports:
      - "8000:80" # On expose Symfony sur le port 8000 pour éviter les conflits
    volumes:
      - .:/var/www/html:ro,cached
      - ./var/log/nginx:/var/log/nginx
      - ./infra/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - php
    networks:
      - global_infra_network

  php:
    build:
      context: ./infra/
      dockerfile: ./php/Dockerfile
    volumes:
      - .:/var/www/html:cached
      - ./infra/php/php-fpm.d/www.conf:/usr/local/etc/php-fpm.d/www.conf
      - ./infra/php/config/php.ini:/usr/local/etc/php/php.ini
      - ./infra/php/xdebug/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
    networks:
      - global_infra_network
    expose:
      - "9000"

# On connecte le projet de Maryam au réseau de ton infrastructure globale
networks:
  global_infra_network:
    external: true
    name: infrastructure_default
