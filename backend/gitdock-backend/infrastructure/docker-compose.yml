services:
  # --- Postgres ---
  gitdock-postgres:
    image: postgres:15-alpine
    container_name: gitdock-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gitdock_sync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gitdock_global_network

  # --- RabbitMQ ---
  gitdock-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gitdock-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - gitdock_global_network

  # --- MySQL (Optionnel pour ton test actuel) ---
  gitdock-mysql:
    image: mysql:8.0
    container_name: gitdock-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gitdock_tasks
    ports:
      - "3306:3306"
    networks:
      - gitdock_global_network

volumes:
  postgres_data:
  mysql_tasks_data:

networks:
  gitdock_global_network:
    name: gitdock_shared_net
    driver: bridge