server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      # Supprime les headers en double (CORS) pour éviter les conflits entre Spring et .NET
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

      discovery:
        locator:
          enabled: false
      # --- CONFIGURATION CORS ---
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      # --- DEFINITION DES ROUTES ---
      routes:
        # --- Authentication Service ---
        - id: auth-service
          uri: lb://GITDOCK-AUTH
          predicates:
            - Path=/api/auth/**

        # --- Project Management Service ---
        - id: project-service
          uri: lb://GITDOCK-PROJECT
          predicates:
            - Path=/api/projects/**

        # --- Git Synchronization Service ---
        - id: sync-service
          uri: lb://gitdock-sync
          predicates:
            - Path=/api/sync/**

        # --- Notifications (REST & WebSocket) ---
        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/notifications/**, /ws-notifications/**

        # --- Task Management Service ---
        - id: task-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/tasks/**

        - id: gamification-service
          uri: http://127.0.0.1:5292
          predicates:
            - Path=/api/badges/**, /api/levels/**, /api/tags/**, /api/xpconfig/**

        - id: yam-service
          uri: http://localhost:8010
        # --- AI Service (FastAPI / Python) ---
        # Remis comme avant avec lb:// car il fonctionne déjà avec son IP
        - id: ai-service
          uri: http://localhost:8000
          predicates:
            - Path=/api/ai/**
          filters:
            - RewritePath=/api/ai/(?<segment>.*), /api/v1/${segment}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
        # --- Gamification Service (.NET 9) ---
        # Configuration directe sur localhost pour éviter les problèmes de DNS Docker
        - id: gamification-service
          uri: http://localhost:5292
          predicates:
            - Path=/api/gamification/**
          filters:
            - RewritePath=/api/gamification/(?<segment>.*), /api/${segment}