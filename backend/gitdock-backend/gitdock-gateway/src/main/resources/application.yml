server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      discovery:
        locator:
          enabled: false
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:4173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: project-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/projects/**

        - id: sync-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/sync/**

        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/notifications/**, /ws-notifications/**

        - id: task-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/tasks/**

        - id: gamification-service
          uri: http://localhost:5292
          predicates:
            - Path=/api/badges/**, /api/Badges/**, /api/levels/**, /api/Levels/**, /api/tags/**, /api/Tags/**, /api/xpconfig/**, /api/XpConfig/**, /api/UserBadge/**, /api/UserProgress/**, /api/contributors/**, /api/Contributors/**

        - id: yam-service
          uri: http://localhost:8012
          predicates:
            - Path=/api/yam/**

        - id: ai-service
          uri: http://localhost:8000
          predicates:
            - Path=/api/v1/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: false
    fetch-registry: false