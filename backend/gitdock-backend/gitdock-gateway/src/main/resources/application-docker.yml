spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:4173"

      routes:
        - id: auth-service
          uri: lb://GITDOCK-AUTH
          predicates:
            - Path=/api/auth/**

        - id: project-service
          uri: lb://GITDOCK-PROJECT
          predicates:
            - Path=/api/projects/**

        - id: sync-service
          uri: lb://GITDOCK-SYNC
          predicates:
            - Path=/api/sync/**

        - id: notification-service
          uri: http://gitdock-notification:8085
          predicates:
            - Path=/api/notifications/**, /ws-notifications/**

        - id: task-service
          uri: http://nginx_webserver:80
          predicates:
            - Path=/api/tasks/**

        - id: gamification-service
          uri: http://gitdock-gamification:5292
          predicates:
            - Path=/api/badges/**, /api/Badges/**, /api/levels/**, /api/Levels/**, /api/tags/**, /api/Tags/**, /api/xpconfig/**, /api/XpConfig/**, /api/UserBadge/**, /api/UserProgress/**, /api/contributors/**, /api/Contributors/**

        - id: yam-service
          uri: http://gitdock-chromadb:8000
          predicates:
            - Path=/api/yam/**

        - id: ai-service
          uri: http://gitdock-ai-api:8000
          predicates:
            - Path=/api/v1/**

eureka:
  client:
    service-url:
      defaultZone: http://gitdock-discovery:8761/eureka/