# On utilise la porte 5432 de la maison pour entrer dans la chambre Postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/gitdock_sync
spring.datasource.username=guest
spring.datasource.password=guest
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate crée et supprime les tables à chaque test pour rester propre
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect