# Build, test and measure coverage of the Spring Boot services.
# Only the services touched by a change are rebuilt; a change to the parent
# POM, the Maven wrapper or this workflow rebuilds all of them.
name: Java services

on:
  push:
    branches: [main]
    paths:
      - "backend/gitdock-backend/pom.xml"
      - "backend/gitdock-backend/mvnw"
      - "backend/gitdock-backend/.mvn/**"
      - "backend/gitdock-backend/gitdock-auth/**"
      - "backend/gitdock-backend/gitdock-discovery/**"
      - "backend/gitdock-backend/gitdock-gateway/**"
      - "backend/gitdock-backend/gitdock-notification/**"
      - "backend/gitdock-backend/gitdock-project/**"
      - "backend/gitdock-backend/gitdock-sync/**"
      - ".github/workflows/java.yml"
  pull_request:
    paths:
      - "backend/gitdock-backend/pom.xml"
      - "backend/gitdock-backend/mvnw"
      - "backend/gitdock-backend/.mvn/**"
      - "backend/gitdock-backend/gitdock-auth/**"
      - "backend/gitdock-backend/gitdock-discovery/**"
      - "backend/gitdock-backend/gitdock-gateway/**"
      - "backend/gitdock-backend/gitdock-notification/**"
      - "backend/gitdock-backend/gitdock-project/**"
      - "backend/gitdock-backend/gitdock-sync/**"
      - ".github/workflows/java.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JACOCO_VERSION: "0.8.15"

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      services: ${{ steps.all.outputs.services || steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select every service (manual run)
        id: all
        if: github.event_name == 'workflow_dispatch'
        run: >-
          echo 'services=["gitdock-auth","gitdock-discovery","gitdock-gateway",
          "gitdock-notification","gitdock-project","gitdock-sync"]' >> "$GITHUB_OUTPUT"

      - name: Select changed services
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            gitdock-auth:
              - "backend/gitdock-backend/gitdock-auth/**"
              - "backend/gitdock-backend/{pom.xml,mvnw,.mvn/**}"
              - ".github/workflows/java.yml"
            gitdock-discovery:
              - "backend/gitdock-backend/gitdock-discovery/**"
              - "backend/gitdock-backend/{pom.xml,mvnw,.mvn/**}"
              - ".github/workflows/java.yml"
            gitdock-gateway:
              - "backend/gitdock-backend/gitdock-gateway/**"
              - "backend/gitdock-backend/{pom.xml,mvnw,.mvn/**}"
              - ".github/workflows/java.yml"
            gitdock-notification:
              - "backend/gitdock-backend/gitdock-notification/**"
              - "backend/gitdock-backend/{pom.xml,mvnw,.mvn/**}"
              - ".github/workflows/java.yml"
            gitdock-project:
              - "backend/gitdock-backend/gitdock-project/**"
              - "backend/gitdock-backend/{pom.xml,mvnw,.mvn/**}"
              - ".github/workflows/java.yml"
            gitdock-sync:
              - "backend/gitdock-backend/gitdock-sync/**"
              - "backend/gitdock-backend/{pom.xml,mvnw,.mvn/**}"
              - ".github/workflows/java.yml"

  build:
    name: ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.services != '' && needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: backend/gitdock-backend
    # The auth test profile and the notification context test expect a real
    # PostgreSQL; the database, user and password below mirror
    # gitdock-auth/src/test/resources/application-test.yml.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: sa
          POSTGRES_PASSWORD: sa
          POSTGRES_DB: gitdock_auth_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sa -d gitdock_auth_db"
          --health-interval 5s --health-timeout 5s --health-retries 12
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 10s --health-retries 12
    # Test-only values. The services have no default for these variables and
    # refuse to start without them; none of them is a real credential.
    env:
      JWT_SECRET: ci-test-key-ci-test-key-ci-test-key-ci-test-key
      GITHUB_CLIENT_ID: ci-test-client-id
      GITHUB_CLIENT_SECRET: ci-test-client-secret
      MAIL_HOST: localhost
      MAIL_PORT: "2525"
      MAIL_USERNAME: ci-test
      MAIL_PASSWORD: ci-test
      RABBITMQ_PASSWORD: guest
      DB_USERNAME: sa
      DB_PASSWORD: sa
      DB_NAME: gitdock_auth_db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/gitdock-backend/**/pom.xml

      # gitdock-sync's integration test connects to its own database as
      # postgres/postgres (ProjectSyncListenerIntegrationTest); test-only values.
      - name: Prepare the gitdock-sync test database
        if: matrix.service == 'gitdock-sync'
        env:
          PGPASSWORD: sa
        run: |
          psql -h localhost -U sa -d gitdock_auth_db -c "CREATE ROLE postgres LOGIN SUPERUSER PASSWORD 'postgres'"
          psql -h localhost -U sa -d gitdock_auth_db -c "CREATE DATABASE gitdock_sync OWNER postgres"

      # Maven Central occasionally answers 403/5xx to CI runners; resolve
      # dependencies and plugins up front, with a few retries.
      - name: Resolve dependencies
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          for attempt in 1 2 3; do
            ./mvnw --batch-mode --no-transfer-progress --projects "$SERVICE" --also-make dependency:go-offline && exit 0
            echo "::warning::Dependency resolution failed (attempt $attempt), retrying"
            sleep 20
          done
          exit 1

      - name: Build, test and report coverage
        env:
          SERVICE: ${{ matrix.service }}
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          --projects "$SERVICE" --also-make
          "org.jacoco:jacoco-maven-plugin:${JACOCO_VERSION}:prepare-agent"
          verify
          "org.jacoco:jacoco-maven-plugin:${JACOCO_VERSION}:report"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ matrix.service }}
          path: |
            backend/gitdock-backend/${{ matrix.service }}/target/surefire-reports/
            backend/gitdock-backend/${{ matrix.service }}/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14
