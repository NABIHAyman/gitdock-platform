# Validate, analyse and test the task service (Symfony).
name: PHP service

on:
  push:
    branches: [main]
    paths:
      - "backend/gitdock-backend/gitdock-task/**"
      - ".github/workflows/php.yml"
  pull_request:
    paths:
      - "backend/gitdock-backend/gitdock-task/**"
      - ".github/workflows/php.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: gitdock-task
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/gitdock-backend/gitdock-task
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          extensions: ctype, iconv, intl, pdo_mysql, amqp
          tools: composer:v2, phpstan:2.2.14
          coverage: none

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/gitdock-backend/gitdock-task/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Validate composer.json and composer.lock
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Static analysis
        run: phpstan analyse src --level=1 --no-progress --error-format=github

      - name: Unit tests
        run: vendor/bin/phpunit
