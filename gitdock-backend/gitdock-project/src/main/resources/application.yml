server:
  port: 8083 # On utilise 8081 pour ne pas entrer en conflit avec Auth (8083)
  error:
    include-message: always

spring:
  application:
    name: gitdock-project

  datasource:
    url: jdbc:postgresql://localhost:5432/gitdock_project
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  sql:
    init:
      mode: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

application:
  security:
    jwt:
      # C'est LA clé magique copiée depuis gitdock-auth !
      secret: ***REMOVED***


  # 👇 LA LIGNE MAGIQUE POUR ACTIVER LE FALLBACK 👇
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true


  jackson:
    serialization:
      write-dates-as-timestamps: false

# Configuration du Disjoncteur (Resilience4j)
resilience4j:
  circuitbreaker:
    instances:
      authService: # Nom de notre disjoncteur
        registerHealthIndicator: true
        slidingWindowSize: 10 # Analyse les 10 dernières requêtes
        permittedNumberOfCallsInHalfOpenState: 3 # Requêtes test quand il essaie de se refermer
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5 # Attend au moins 5 requêtes avant de juger
        waitDurationInOpenState: 10s # Reste ouvert (bloqué) 10 secondes avant de retester
        failureRateThreshold: 50 # Si 50% des requêtes échouent, il disjoncte !